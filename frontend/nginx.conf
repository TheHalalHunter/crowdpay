server {
  listen 8080;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://horizon-testnet.stellar.org https://horizon.stellar.org https://soroban-testnet.stellar.org https://soroban.stellar.org https://www.freighter.app https://api.freighter.app https://extstellar.moneygram.com https://previewstellar.moneygram.com https://stellar.moneygram.com https://testanchor.stellar.org https://*.ingest.sentry.io https://firebaseinstallations.googleapis.com https://fcmregistrations.googleapis.com https://*.googleapis.com; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; media-src 'self'; form-action 'self'; frame-ancestors 'none'; report-uri /api/csp-report; report-to csp-endpoint; upgrade-insecure-requests;" always;
  add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; img-src 'self' data: https://cdn.crowdpay.com https://images.unsplash.com https://ipfs.io; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://horizon-testnet.stellar.org https://horizon.stellar.org https://soroban-testnet.stellar.org https://soroban.stellar.org https://www.freighter.app https://api.freighter.app https://extstellar.moneygram.com https://previewstellar.moneygram.com https://stellar.moneygram.com https://testanchor.stellar.org https://*.ingest.sentry.io https://firebaseinstallations.googleapis.com https://fcmregistrations.googleapis.com https://*.googleapis.com; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; media-src 'self'; form-action 'self'; frame-ancestors 'none'; report-uri /api/csp-report; report-to csp-endpoint;" always;
  add_header Reporting-Endpoints 'csp-endpoint="/api/csp-report"' always;
  index index.html;

  location ~* \.map$ {
    deny all;
  }

  location / {
    try_files $uri $uri/ /index.html;  # SPA fallback
  }

  location /api/ {
    proxy_pass http://backend:3001;    # forward API calls to backend service
  }

  location = /health {
    proxy_pass http://backend:3001/health;
    proxy_next_upstream off;
  }
}
